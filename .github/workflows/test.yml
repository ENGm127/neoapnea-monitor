name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'tests/*.test.mjs'
      - name: Test firmware SpO2 stream helper
        run: g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/neoapnea_monitor tests/firmware/spo2_stream_test.cpp -o /tmp/spo2_stream_test && /tmp/spo2_stream_test
